name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        # next lint was removed in Next.js 16; use npm run lint (eslint .)
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SYNTHEX_CHAIN_ID: ''
          NEXT_PUBLIC_REOWN_PROJECT_ID: ''

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Migrations only ever run against SQLite (tests) or Postgres
    # (production) — verifying against SQLite alone can silently miss a
    # Postgres-incompatible migration (column type, batch-mode ALTER TABLE
    # emulation quirks, etc.) until it breaks the real deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synthex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Alembic heads (exactly one — catches a branching migration history)
        run: |
          heads=$(alembic heads)
          echo "$heads"
          count=$(echo "$heads" | grep -c "(head)")
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $count"
            exit 1
          fi
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///./test.db'

      - name: Alembic upgrade against PostgreSQL
        run: alembic upgrade head
        env:
          DATABASE_URL: 'postgresql+asyncpg://postgres:postgres@localhost:5432/synthex_ci'

      - name: Run tests
        run: pytest tests/ -v -n auto
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///./test.db'
          USE_DEMO_DATA: 'true'
          CORS_ORIGINS: 'http://localhost:3000'
