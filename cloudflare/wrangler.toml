name            = "synthetic-exposure-cron"
main            = "src/worker.js"
compatibility_date = "2024-09-23"

# Cron schedules — all three fire the same Worker; routing is done inside
# worker.js via the ROUTES map. The backend decides whether a given fire is
# actually due (market state, bucket boundary, demo mode) — the Worker just
# dispatches on schedule.
[triggers]
crons = [
  "*/5 * * * *",    # every 5 minutes → refresh-crypto-quotes
  "2,32 * * * *",   # 2 min after each 30-min boundary → refresh-intraday (offset so the
                     # just-completed Marketstack/candle data has actually landed)
  "0 23 * * 2,5",   # 23:00 UTC, Tuesday + Friday (after US market close) → refresh-history-and-scores
  "0 4 * * *",      # 04:00 UTC daily (quiet hours, no overlap with the above) → refresh-portfolio-catalogue
]
